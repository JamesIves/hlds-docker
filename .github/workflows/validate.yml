name: Validate Docker Image 🐳
permissions:
  contents: read
on:
  push:
    branches-ignore:
      - main
      - beta
  # beta itself is excluded above, so a beta->main promotion PR would
  # otherwise never get these checks run against it. This targets only
  # that case - normal feature-branch PRs already get checks via push.
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    name: Build and Validate 🏁
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        game:
          [
            cstrike,
            cstrike-legacy,
            valve,
            valve-legacy,
            czero,
            czero-legacy,
            dmc,
            gearbox,
            ricochet,
            dod,
            tfc,
            tfc-legacy,
          ]
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx 🛠️
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # -legacy is our own naming convention, not a literal GAME/mod value.
      - name: Set GAME environment variable 🎮
        run: |
          GAME=${{ matrix.game }}
          GAME=${GAME%-legacy}
          echo "GAME=$GAME" >> "$GITHUB_ENV"

      - name: Configure SteamCMD to install the legacy engine version 🚒
        if: contains(matrix.game, 'legacy')
        run: echo "FLAG=-beta steam_legacy" >> "$GITHUB_ENV"

      - name: Build Docker Image 🐳
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        env:
          GAME: ${{ env.GAME }}
          FLAG: ${{ env.FLAG }}
        with:
          context: ./container
          build-args: |
            GAME=${{ env.GAME }}
            FLAG=${{ env.FLAG }}
          load: true
          tags: hlds-validate:${{ matrix.game }}

      - name: Get Docker Image ID 🆔
        id: get_image_id
        run: echo "image_id=$(docker images -q | head -n 1)" >> "$GITHUB_ENV"

      - name: Scan Image for Vulnerabilities 🔍
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.image_id }}
          version: v0.73.0
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Vulnerability Scan Results 📤
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.game }}

      - name: Test Image 🧪
        uses: ./.github/actions/test-hlds-image
        with:
          game: ${{ env.GAME }}
          image: ${{ env.image_id }}
          container-name: hlds-${{ matrix.game }}

      # Only needs to run once, not once per matrix leg.
      - name: Validate Invalid GAME Fails Safely 🚫
        if: matrix.game == 'valve'
        run: |
          docker run -d -ti \
            --name hlds-invalid-game \
            -p 27016:27015/udp \
            -e GAME=totally-not-a-real-game \
            ${{ env.image_id }} \
            "+log on +maxplayers 12 +map crazytank"

          python3 .github/actions/test-hlds-image/check_a2s_info.py \
            --port 27016 --timeout 20 --expect-no-response

          echo "Confirming healthcheck.sh agrees the server is unhealthy..."
          if docker exec hlds-invalid-game ./healthcheck.sh; then
            echo "healthcheck.sh reported healthy for a server that never started!"
            exit 1
          fi
          echo "healthcheck.sh correctly reported the server as unhealthy."

          echo "--- Container status/logs for the invalid GAME run ---"
          docker inspect hlds-invalid-game --format='Status: {{.State.Status}}, ExitCode: {{.State.ExitCode}}'
          docker logs hlds-invalid-game || true

      # Only needs to run once, not once per matrix leg - and doesn't touch
      # Docker at all, so it can run independently of the rest of this job.
      - name: Test Steam Update Checker Parser (Fixture) 🧪
        if: matrix.game == 'valve'
        run: python3 .github/scripts/check_steam_updates_test.py

      # Same script, but against a live steamcmd dump instead of the bundled
      # fixture - the fixture only proves our parser handles the VDF shape
      # we *think* Steam returns; this proves it still matches what Steam
      # actually returns today.
      - name: Smoke Test Steam Update Checker (Live) 🧪
        if: matrix.game == 'valve'
        run: |
          mkdir -p /tmp/steamcmd
          curl -sL media.steampowered.com/client/installer/steamcmd_linux.tar.gz | tar xzvf - -C /tmp/steamcmd

          /tmp/steamcmd/steamcmd.sh \
            +@ShutdownOnFailedCommand 0 \
            +@NoPromptForPassword 1 \
            +login anonymous \
            +app_info_update 1 \
            +app_info_print 90 \
            +quit > /tmp/live_app_info.txt

          python3 .github/scripts/check_steam_updates_test.py /tmp/live_app_info.txt

      - name: Cleanup 🧹
        if: always()
        run: |
          docker logs hlds-${{ matrix.game }} || true
          docker stop hlds-${{ matrix.game }} || true
          docker rm hlds-${{ matrix.game }} || true
          docker stop hlds-invalid-game || true
          docker rm hlds-invalid-game || true
          docker system prune --all --force
