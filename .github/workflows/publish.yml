name: Publish Docker Images 🐋 📦
concurrency: ci-${{ github.ref }}
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version component to bump"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
jobs:
  version:
    name: Compute Release Version 🔢
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: "0"

      - name: Validate Dispatch Branch 🌿
        run: |
          if [ "${{ github.ref_name }}" != "beta" ]; then
            echo "::error::Releases must be dispatched from 'beta' (got '${{ github.ref_name }}')."
            exit 1
          fi

      - name: Compute Next Version 🔢
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh release view --json tagName --jq .tagName 2>/dev/null || echo "v0.0.0")
          VERSION="${LATEST#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "Bumping $LATEST -> $NEW_VERSION (${{ inputs.bump }})"

          if gh release view "$NEW_VERSION" >/dev/null 2>&1; then
            echo "::error::A release for '$NEW_VERSION' already exists."
            exit 1
          fi

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build Docker Image 🐳
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      security-events: write
    strategy:
      matrix:
        game:
          [
            cstrike,
            cstrike-legacy,
            valve,
            valve-legacy,
            czero,
            czero-legacy,
            dmc,
            gearbox,
            ricochet,
            dod,
            tfc,
            tfc-legacy,
          ]
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: "0"

      # Tests this leg builds below run against the actual merge result, not
      # just main on its own - this is local to the runner and isn't pushed.
      - name: Merge beta into main (local, not pushed) 🔀
        run: |
          git fetch origin beta
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            merge origin/beta --no-edit

      - name: Set up Docker Buildx  🛠️
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to DockerHub 🐳
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Login to GitHub Container Registry 🐳
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set GAME environment variable 🎮
        working-directory: ./container
        run: |
          GAME=${{ matrix.game }}
          GAME=${GAME%-legacy}
          echo "GAME=$GAME" >> "$GITHUB_ENV"

      - name: Replace fallback value in Dockerfile and entrypoint.sh 📝
        working-directory: ./container
        run: |
          sed -i "s/\${GAME:-valve}/\${GAME:-${{ env.GAME }}}/g" Dockerfile
          sed -i "s/\${GAME:-valve}/\${GAME:-${{ env.GAME }}}/g" entrypoint.sh

      - name: Configure SteamCMD to install the legacy engine version 🚒
        if: contains(matrix.game, 'legacy')
        run: echo "FLAG=-beta steam_legacy" >> "$GITHUB_ENV"

      - name: Set Game Title 🎮
        id: game_title
        run: |
          declare -A GAME_TITLES=(
            ["cstrike"]="Counter-Strike"
            ["valve"]="Half-Life Deathmatch"
            ["czero"]="Counter-Strike Condition Zero"
            ["dmc"]="Deathmatch Classic"
            ["gearbox"]="Half-Life Opposing Force"
            ["ricochet"]="Ricochet"
            ["dod"]="Day of Defeat"
            ["tfc"]="Team Fortress Classic"
          )
          GAME_TITLE="${GAME_TITLES[${{ env.GAME }}]:-${{ env.GAME }}}"
          echo "game_title=$GAME_TITLE" >> "$GITHUB_ENV"

      - name: Docker Metadata 🏷️
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            jives/hlds
            ghcr.io/${{ github.repository_owner }}/hlds
          tags: |
            type=raw,value=${{ matrix.game }}
            type=raw,value=${{ matrix.game }}-${{ env.VERSION }}
          labels: |
            org.opencontainers.image.title=Half Life Dedicated Server for ${{ env.game_title }}
            org.opencontainers.image.description=🐋 📦 Half Life Dedicated Server for ${{ env.game_title }}. Supports all the classic GoldSrc Half-Life games and mods, including the ability to add custom configurations and plugins.
            org.opencontainers.image.vendor=https://jamesiv.es
            org.opencontainers.image.authors=James Ives (https://jamesiv.es)
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.url=https://github.com/jamesives/hlds-docker
            org.opencontainers.image.documentation=https://github.com/jamesives/hlds-docker
            org.opencontainers.image.source=https://github.com/jamesives/hlds-docker
            org.opencontainers.image.version=${{ env.VERSION }}
          annotations: |
            org.opencontainers.image.title=Half Life Dedicated Server for ${{ env.game_title }}
            org.opencontainers.image.description=🐋 📦 Half Life Dedicated Server for ${{ env.game_title }}. Supports all the classic GoldSrc Half-Life games and mods, including the ability to add custom configurations and plugins.
            org.opencontainers.image.vendor=https://jamesiv.es
            org.opencontainers.image.authors=James Ives (https://jamesiv.es)
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.url=https://github.com/jamesives/hlds-docker
            org.opencontainers.image.documentation=https://github.com/jamesives/hlds-docker
            org.opencontainers.image.source=https://github.com/jamesives/hlds-docker
            org.opencontainers.image.version=${{ env.VERSION }}

      - name: Build Docker Image 🐳
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        env:
          GAME: ${{ env.GAME }}
          FLAG: ${{ env.FLAG }}
          IMAGE: jives/hlds:${{ matrix.game }}-${{ env.VERSION }}
        with:
          context: ./container
          push: false
          load: true
          tags: |
            jives/hlds:${{ matrix.game }}
            jives/hlds:${{ matrix.game }}-${{ env.VERSION }}
          build-args: |
            GAME=${{ env.GAME }}
            FLAG=${{ env.FLAG }}
            VERSION=${{ env.VERSION }}
            IMAGE=jives/hlds:${{ matrix.game }}-${{ env.VERSION }}

      - name: Get Docker Image ID 🆔
        id: get_image_id
        run: echo "image_id=$(docker images -q | head -n 1)" >> "$GITHUB_ENV"

      - name: Scan Image for Vulnerabilities 🔍
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.image_id }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Vulnerability Scan Results 📤
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-release-${{ matrix.game }}

      - name: Test Image 🧪
        uses: ./.github/actions/test-hlds-image
        with:
          game: ${{ env.GAME }}
          image: ${{ env.image_id }}
          container-name: hlds

      - name: Build and Push Docker Image to DockerHub 🐳
        id: push_dockerhub
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        env:
          GAME: ${{ env.GAME }}
          FLAG: ${{ env.FLAG }}
          IMAGE: jives/hlds:${{ matrix.game }}-${{ env.VERSION }}
        with:
          context: ./container
          push: true
          tags: |
            jives/hlds:${{ matrix.game }}
            jives/hlds:${{ matrix.game }}-${{ env.VERSION }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            GAME=${{ env.GAME }}
            FLAG=${{ env.FLAG }}
            VERSION=${{ env.VERSION }}
            IMAGE=jives/hlds:${{ matrix.game }}-${{ env.VERSION }}

      - name: Attest DockerHub Image Provenance 📜
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: index.docker.io/jives/hlds
          subject-digest: ${{ steps.push_dockerhub.outputs.digest }}

      - name: Set repo owner to lowercase 📝
        id: repo_owner
        run: |
          REPO_OWNER=$(echo ${{ github.repository_owner }} | awk '{print tolower($0)}')
          echo "repo_owner=$REPO_OWNER" >> "$GITHUB_ENV"

      - name: Build and Push Docker Image to GitHub Container Registry 🐳
        id: push_ghcr
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        env:
          GAME: ${{ env.GAME }}
          FLAG: ${{ env.FLAG }}
          IMAGE: ghcr.io/${{ env.repo_owner }}/hlds:${{ matrix.game }}-${{ env.VERSION }}
        with:
          context: ./container
          push: true
          tags: |
            ghcr.io/${{ env.repo_owner }}/hlds:${{ matrix.game }}
            ghcr.io/${{ env.repo_owner }}/hlds:${{ matrix.game }}-${{ env.VERSION }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            GAME=${{ env.GAME }}
            FLAG=${{ env.FLAG }}
            VERSION=${{ env.VERSION }}
            IMAGE=ghcr.io/${{ env.repo_owner }}/hlds:${{ matrix.game }}-${{ env.VERSION }}

      - name: Attest GHCR Image Provenance 📜
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/${{ env.repo_owner }}/hlds
          subject-digest: ${{ steps.push_ghcr.outputs.digest }}
          push-to-registry: true

      - name: Cleanup 🧹
        if: always()
        run: |
          docker logs hlds || true
          docker stop hlds || true
          docker rm hlds || true
          docker system prune --all --force

  merge:
    name: Merge beta into main 🔀
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: "0"

      # Every build leg already proved this exact merge builds, scans, and
      # passes the live-server smoke tests - this is the only step that
      # actually pushes it.
      - name: Merge and push 🔀
        run: |
          git fetch origin beta
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            merge origin/beta --no-edit
          git push origin main

  publish:
    name: Publish GitHub Release 🚀
    needs: [version, merge]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: "0"

      - name: Create Release 🚀
        run: |
          gh release create "${{ needs.version.outputs.version }}" \
            --generate-notes \
            --title "${{ needs.version.outputs.version }}" \
            --target main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
