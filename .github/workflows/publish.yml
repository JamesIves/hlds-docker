name: Publish Docker Images 🐋 📦
concurrency: ci-${{ github.ref }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version number to publish (e.g. v1.0.0)"
        required: true
        type: string
jobs:
  validate-inputs:
    name: Validate Release Inputs 🔎
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate Dispatch Branch 🌿
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "::error::Releases must be published from 'main' (got '${{ github.ref_name }}'). Re-run this workflow from the main branch."
            exit 1
          fi

      - name: Validate Version Format 🔢
        run: |
          VERSION="${{ inputs.version }}"
          if ! echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$VERSION' is not a valid semantic version (expected format: vX.Y.Z)."
            exit 1
          fi

      - name: Validate Version Is Not Already Released 🔍
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::A release for '${{ inputs.version }}' already exists. Choose a new version or delete the existing release first."
            exit 1
          fi

  build:
    name: Build Docker Image 🐳
    needs: validate-inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      security-events: write
    strategy:
      matrix:
        game:
          [
            cstrike,
            cstrike-legacy,
            valve,
            valve-legacy,
            czero,
            czero-legacy,
            dmc,
            gearbox,
            ricochet,
            dod,
            tfc,
            tfc-legacy,
          ]
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: "0"

      - name: Set up Docker Buildx  🛠️
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to DockerHub 🐳
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Login to GitHub Container Registry 🐳
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set GAME environment variable 🎮
        working-directory: ./container
        run: |
          GAME=${{ matrix.game }}
          GAME=${GAME%-legacy}
          echo "GAME=$GAME" >> "$GITHUB_ENV"

      - name: Replace fallback value in Dockerfile and entrypoint.sh 📝
        working-directory: ./container
        run: |
          sed -i "s/\${GAME:-valve}/\${GAME:-${{ env.GAME }}}/g" Dockerfile
          sed -i "s/\${GAME:-valve}/\${GAME:-${{ env.GAME }}}/g" entrypoint.sh

      - name: Configure SteamCMD to install the legacy engine version 🚒
        if: contains(matrix.game, 'legacy')
        run: echo "FLAG=-beta steam_legacy" >> "$GITHUB_ENV"

      - name: Set Game Title 🎮
        id: game_title
        run: |
          declare -A GAME_TITLES=(
            ["cstrike"]="Counter-Strike"
            ["valve"]="Half-Life Deathmatch"
            ["czero"]="Counter-Strike Condition Zero"
            ["dmc"]="Deathmatch Classic"
            ["gearbox"]="Half-Life Opposing Force"
            ["ricochet"]="Ricochet"
            ["dod"]="Day of Defeat"
            ["tfc"]="Team Fortress Classic"
          )
          GAME_TITLE="${GAME_TITLES[${{ env.GAME }}]:-${{ env.GAME }}}"
          echo "game_title=$GAME_TITLE" >> "$GITHUB_ENV"

      - name: Docker Metadata 🏷️
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            jives/hlds
            ghcr.io/${{ github.repository_owner }}/hlds
          tags: |
            type=raw,value=${{ matrix.game }}
            type=raw,value=${{ matrix.game }}-${{ inputs.version }}
          labels: |
            org.opencontainers.image.title=Half Life Dedicated Server for ${{ env.game_title }}
            org.opencontainers.image.description=🐋 📦 Half Life Dedicated Server for ${{ env.game_title }}. Supports all the classic GoldSrc Half-Life games and mods, including the ability to add custom configurations and plugins.
            org.opencontainers.image.vendor=https://jamesiv.es
            org.opencontainers.image.authors=James Ives (https://jamesiv.es)
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.url=https://github.com/jamesives/hlds-docker
            org.opencontainers.image.documentation=https://github.com/jamesives/hlds-docker
            org.opencontainers.image.source=https://github.com/jamesives/hlds-docker
            org.opencontainers.image.version=${{ inputs.version }}
          annotations: |
            org.opencontainers.image.title=Half Life Dedicated Server for ${{ env.game_title }}
            org.opencontainers.image.description=🐋 📦 Half Life Dedicated Server for ${{ env.game_title }}. Supports all the classic GoldSrc Half-Life games and mods, including the ability to add custom configurations and plugins.
            org.opencontainers.image.vendor=https://jamesiv.es
            org.opencontainers.image.authors=James Ives (https://jamesiv.es)
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.url=https://github.com/jamesives/hlds-docker
            org.opencontainers.image.documentation=https://github.com/jamesives/hlds-docker
            org.opencontainers.image.source=https://github.com/jamesives/hlds-docker
            org.opencontainers.image.version=${{ inputs.version }}

      - name: Build Docker Image 🐳
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        env:
          GAME: ${{ env.GAME }}
          FLAG: ${{ env.FLAG }}
          VERSION: ${{ inputs.version }}
          IMAGE: jives/hlds:${{ matrix.game }}-${{ inputs.version }}
        with:
          context: ./container
          push: false
          load: true
          tags: |
            jives/hlds:${{ matrix.game }}
            jives/hlds:${{ matrix.game }}-${{ inputs.version }}
          build-args: |
            GAME=${{ env.GAME }}
            FLAG=${{ env.FLAG }}
            VERSION=${{ inputs.version }}
            IMAGE=jives/hlds:${{ matrix.game }}-${{ inputs.version }}

      - name: Get Docker Image ID 🆔
        id: get_image_id
        run: echo "image_id=$(docker images -q | head -n 1)" >> "$GITHUB_ENV"

      # Report-only until the Security tab has a baseline; then flip exit-code to "1".
      - name: Scan Image for Vulnerabilities 🔍
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.image_id }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Vulnerability Scan Results 📤
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-release-${{ matrix.game }}

      - name: Test Image 🧪
        uses: ./.github/actions/test-hlds-image
        with:
          game: ${{ env.GAME }}
          image: ${{ env.image_id }}
          container-name: hlds

      - name: Build and Push Docker Image to DockerHub 🐳
        id: push_dockerhub
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        env:
          GAME: ${{ env.GAME }}
          FLAG: ${{ env.FLAG }}
          VERSION: ${{ inputs.version }}
          IMAGE: jives/hlds:${{ matrix.game }}-${{ inputs.version }}
        with:
          context: ./container
          push: true
          tags: |
            jives/hlds:${{ matrix.game }}
            jives/hlds:${{ matrix.game }}-${{ inputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            GAME=${{ env.GAME }}
            FLAG=${{ env.FLAG }}
            VERSION=${{ inputs.version }}
            IMAGE=jives/hlds:${{ matrix.game }}-${{ inputs.version }}

      - name: Attest DockerHub Image Provenance 📜
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: index.docker.io/jives/hlds
          subject-digest: ${{ steps.push_dockerhub.outputs.digest }}

      - name: Set repo owner to lowercase 📝
        id: repo_owner
        run: |
          REPO_OWNER=$(echo ${{ github.repository_owner }} | awk '{print tolower($0)}')
          echo "repo_owner=$REPO_OWNER" >> "$GITHUB_ENV"

      - name: Build and Push Docker Image to GitHub Container Registry 🐳
        id: push_ghcr
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        env:
          GAME: ${{ env.GAME }}
          FLAG: ${{ env.FLAG }}
          VERSION: ${{ inputs.version }}
          IMAGE: ghcr.io/${{ env.repo_owner }}/hlds:${{ matrix.game }}-${{ inputs.version }}
        with:
          context: ./container
          push: true
          tags: |
            ghcr.io/${{ env.repo_owner }}/hlds:${{ matrix.game }}
            ghcr.io/${{ env.repo_owner }}/hlds:${{ matrix.game }}-${{ inputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            GAME=${{ env.GAME }}
            FLAG=${{ env.FLAG }}
            VERSION=${{ inputs.version }}
            IMAGE=ghcr.io/${{ env.repo_owner }}/hlds:${{ matrix.game }}-${{ inputs.version }}

      - name: Attest GHCR Image Provenance 📜
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/${{ env.repo_owner }}/hlds
          subject-digest: ${{ steps.push_ghcr.outputs.digest }}
          push-to-registry: true

      - name: Cleanup 🧹
        if: always()
        run: |
          docker logs hlds || true
          docker stop hlds || true
          docker rm hlds || true
          docker system prune --all --force

  publish:
    name: Publish GitHub Release 🚀
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: "0"

      - name: Create Release 🚀
        run: gh release create "${{ inputs.version }}" --generate-notes --title "${{ inputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
