name: Publish Beta Docker Images 🐋 📦
concurrency: ci-${{ github.ref }}
on:
  push:
    branches:
      - beta
jobs:
  build:
    name: Build Beta Docker Image 🐳
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      security-events: write
    strategy:
      matrix:
        game:
          [
            cstrike,
            cstrike-legacy,
            valve,
            valve-legacy,
            czero,
            czero-legacy,
            dmc,
            gearbox,
            ricochet,
            dod,
            tfc,
            tfc-legacy,
          ]
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: "0"

      - name: Set up Docker Buildx  🛠️
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to DockerHub 🐳
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Login to GitHub Container Registry 🐳
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set GAME environment variable 🎮
        working-directory: ./container
        run: |
          GAME=${{ matrix.game }}
          GAME=${GAME%-legacy}
          echo "GAME=$GAME" >> "$GITHUB_ENV"

      - name: Replace fallback value in Dockerfile and entrypoint.sh 📝
        working-directory: ./container
        run: |
          sed -i "s/\${GAME:-valve}/\${GAME:-${{ env.GAME }}}/g" Dockerfile
          sed -i "s/\${GAME:-valve}/\${GAME:-${{ env.GAME }}}/g" entrypoint.sh

      - name: Configure SteamCMD to install the legacy engine version 🚒
        if: contains(matrix.game, 'legacy')
        run: echo "FLAG=-beta steam_legacy" >> "$GITHUB_ENV"

      - name: Set Game Title 🎮
        id: game_title
        run: |
          declare -A GAME_TITLES=(
            ["cstrike"]="Counter-Strike"
            ["valve"]="Half-Life Deathmatch"
            ["czero"]="Counter-Strike Condition Zero"
            ["dmc"]="Deathmatch Classic"
            ["gearbox"]="Half-Life Opposing Force"
            ["ricochet"]="Ricochet"
            ["dod"]="Day of Defeat"
            ["tfc"]="Team Fortress Classic"
          )
          GAME_TITLE="${GAME_TITLES[${{ env.GAME }}]:-${{ env.GAME }}}"
          echo "game_title=$GAME_TITLE" >> "$GITHUB_ENV"

      - name: Docker Metadata 🏷️
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: |
            jives/hlds
            ghcr.io/${{ github.repository_owner }}/hlds
          tags: |
            type=raw,value=${{ matrix.game }}-beta
          labels: |
            org.opencontainers.image.title=Half Life Dedicated Server for ${{ env.game_title }} (Beta)
            org.opencontainers.image.description=🐋 📦 Half Life Dedicated Server for ${{ env.game_title }} (Beta). This is a beta build and may be unstable. Supports GoldSrc mods, custom configurations and plugins.
            org.opencontainers.image.vendor=https://jamesiv.es
            org.opencontainers.image.authors=James Ives (https://jamesiv.es)
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.url=https://github.com/jamesives/hlds-docker
            org.opencontainers.image.documentation=https://github.com/jamesives/hlds-docker
            org.opencontainers.image.source=https://github.com/jamesives/hlds-docker
            org.opencontainers.image.version=beta
          annotations: |
            org.opencontainers.image.title=Half Life Dedicated Server for ${{ env.game_title }} (Beta)
            org.opencontainers.image.description=🐋 📦 Half Life Dedicated Server for ${{ env.game_title }} (Beta). This is a beta build and may be unstable. Supports GoldSrc mods, custom configurations and plugins.
            org.opencontainers.image.vendor=https://jamesiv.es
            org.opencontainers.image.authors=James Ives (https://jamesiv.es)
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.url=https://github.com/jamesives/hlds-docker
            org.opencontainers.image.documentation=https://github.com/jamesives/hlds-docker
            org.opencontainers.image.source=https://github.com/jamesives/hlds-docker
            org.opencontainers.image.version=beta

      - name: Build Docker Image 🐳
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        env:
          GAME: ${{ env.GAME }}
          FLAG: ${{ env.FLAG }}
          VERSION: beta
          IMAGE: jives/hlds:${{ matrix.game }}-beta
        with:
          context: ./container
          push: false
          load: true
          tags: jives/hlds:${{ matrix.game }}-beta
          build-args: |
            GAME=${{ env.GAME }}
            FLAG=${{ env.FLAG }}
            IMAGE=jives/hlds:${{ matrix.game }}-beta
            VERSION=beta

      - name: Get Docker Image ID 🆔
        id: get_image_id
        run: echo "image_id=$(docker images -q | head -n 1)" >> "$GITHUB_ENV"

      - name: Scan Image for Vulnerabilities 🔍
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.image_id }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Vulnerability Scan Results 📤
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-beta-${{ matrix.game }}

      - name: Test Image 🧪
        uses: ./.github/actions/test-hlds-image
        with:
          game: ${{ env.GAME }}
          image: ${{ env.image_id }}
          container-name: hlds

      - name: Build and Push Docker Image to DockerHub 🐳
        id: push_dockerhub
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        env:
          GAME: ${{ env.GAME }}
          FLAG: ${{ env.FLAG }}
          VERSION: beta
          IMAGE: jives/hlds:${{ matrix.game }}-beta
        with:
          context: ./container
          push: true
          tags: jives/hlds:${{ matrix.game }}-beta
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            GAME=${{ env.GAME }}
            FLAG=${{ env.FLAG }}
            IMAGE=jives/hlds:${{ matrix.game }}-beta
            VERSION=beta

      - name: Attest DockerHub Image Provenance 📜
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/jives/hlds
          subject-digest: ${{ steps.push_dockerhub.outputs.digest }}

      - name: Set repo owner to lowercase 📝
        id: repo_owner
        run: |
          REPO_OWNER=$(echo ${{ github.repository_owner }} | awk '{print tolower($0)}')
          echo "repo_owner=$REPO_OWNER" >> "$GITHUB_ENV"

      - name: Build and Push Docker Image to GitHub Container Registry 🐳
        id: push_ghcr
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        env:
          GAME: ${{ env.GAME }}
          FLAG: ${{ env.FLAG }}
          VERSION: beta
          IMAGE: ghcr.io/${{ env.repo_owner }}/hlds:${{ matrix.game }}-beta
        with:
          context: ./container
          push: true
          tags: ghcr.io/${{ env.repo_owner }}/hlds:${{ matrix.game }}-beta
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            GAME=${{ env.GAME }}
            FLAG=${{ env.FLAG }}
            VERSION=beta
            IMAGE=ghcr.io/${{ env.repo_owner }}/hlds:${{ matrix.game }}-beta

      - name: Attest GHCR Image Provenance 📜
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ env.repo_owner }}/hlds
          subject-digest: ${{ steps.push_ghcr.outputs.digest }}
          push-to-registry: true

      - name: Cleanup 🧹
        if: always()
        run: |
          docker logs hlds || true
          docker stop hlds || true
          docker rm hlds || true
          docker system prune --all --force
