name: Publish Sponsors 💖

on:
  workflow_dispatch:
  schedule:
    - cron: 30 15 * * 0-6
permissions:
  contents: write
jobs:
  generate-sponsors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate Sponsors 💖
        uses: JamesIves/github-sponsors-readme-action@02650b8cd445fc16dfef73195f9c406dce041623 # v1
        with:
          token: ${{ secrets.PAT }}
          file: "README.md"
          template: '<a href="https://github.com/{{{ login }}}"><img src="{{ avatarUrl }}" width="25px" alt="{{{ login }}}" /></a>&nbsp;&nbsp;'
          active-only: false
          include-private: true

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
        with:
          token: ${{ secrets.PAT }}
          branch: beta
          folder: "."
          commit-message: "chore: Update sponsors 💖 [skip ci]"
